# Copy to app-config.local.yaml
app:
  title: Pelostage local
organization:
  name: pelotech

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: production
  providers:
    github:
      production:
        clientId:
          $include: github-app-pelostage-local-credentials.yaml#clientId
        clientSecret:
          $include: github-app-pelostage-local-credentials.yaml#clientSecret
        signIn:
          $include: github-app-pelostage-local-credentials.yaml#signIn


integrations:
  github:
    - host: github.com
      apps:
        - appId:
            $include: github-app-pelostage-local-credentials.yaml#appId
          clientId:
            $include: github-app-pelostage-local-credentials.yaml#clientId
          clientSecret:
            $include: github-app-pelostage-local-credentials.yaml#clientSecret
          webhookSecret:
            $include: github-app-pelostage-local-credentials.yaml#webhookSecret
          privateKey:
            $include: github-app-pelostage-local-credentials.yaml#privateKey

# override the org on the providers from app-config.yaml rather than adding new ones
catalog:
  providers:
    github:
      production:
        organization: pelotech
    githubOrg:
      id: production
      githubUrl: https://github.com/pelotech


kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'localKubectlProxy'
