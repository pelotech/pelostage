apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  owner: pelotech

# selectors keep the label: Deployment selectors are immutable
labels:
  - pairs:
      backstage.io/kubernetes-id: pelostage
    includeSelectors: true

resources:
  - ../../base
  - config-map.yaml

patches:
  - target:
      kind: Ingress
      name: pelostage-ingress
    path: ingress-patch.yaml


generators:
  - generators/secrets-generator.yaml

namespace: backstage
