---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: pelostage-ingress
  namespace: backstage
spec:
  ingressClassName: nginx
  rules:
    - host: backstage.host
      http:
        paths:
          - backend:
              service:
                name: backstage
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - backstage.host
      secretName: pelostage-secret

---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      securityContext:
        # the image's `node` user
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: ghcr.io/pelotech/pelostage:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7007
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: K8S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-sa
                  key: token
          envFrom:
            - secretRef:
                name: backstage
            - configMapRef:
                name: backstage
          # https://backstage.io/docs/backend-system/core-services/root-health
          # allow up to 5 minutes for plugins to initialize before liveness applies
          startupProbe:
            httpGet:
              port: http
              path: /.backstage/health/v1/liveness
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: http
              path: /.backstage/health/v1/liveness
          readinessProbe:
            httpGet:
              port: http
              path: /.backstage/health/v1/readiness
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read-only
rules:
  - apiGroups:
      - '*'
    resources:
      - pods
      - pods/log
      - configmaps
      - services
      - deployments
      - replicasets
      - horizontalpodautoscalers
      - ingresses
      - statefulsets
      - limitranges
      - daemonsets
      - rollouts
      - applications
      - appprojects
      - resourcequotas
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage
subjects:
  - kind: ServiceAccount
    name: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read-only
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-sa
  annotations:
    kubernetes.io/service-account.name: backstage
type: kubernetes.io/service-account-token
